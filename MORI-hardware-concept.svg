<g font-size="13" fill="#aabd9b"><text x="945" y="694">Lens → display → main PCB → cell → back shell</text><text x="945" y="718">Concept arrangement; CAD fit not yet verified.</text></g>
<path d="M65 754H1435" stroke="#354231"/><g font-size="13"><text x="65" y="796" fill="#d5ff83" letter-spacing="2">THE CHARACTER</text><text x="65" y="826" fill="#b7c5ad">Instant reactions. Little rituals. Shared memories.</text><text x="65" y="851" fill="#b7c5ad">A tiny room that grows through your small wins.</text><text x="65" y="876" fill="#b7c5ad">Cute through behavior, sound, and gentle haptics.</text><text x="565" y="796" fill="#d5ff83" letter-spacing="2">THE ARCHITECTURE</text><text x="565" y="826" fill="#b7c5ad">Local: personality, animation, games, timers.</text><text x="565" y="851" fill="#b7c5ad">Cloud: conversation and approved memory.</text><text x="565" y="876" fill="#b7c5ad">First release: push-to-talk; no camera or motors.</text><text x="1065" y="796" fill="#d5ff83" letter-spacing="2">THE FIRST PROOF</text><text x="1065" y="826" fill="#b7c5ad">One useful focus ritual.</text><text x="1065" y="851" fill="#b7c5ad">10–20 real-world testers.</text><text x="1065" y="876" fill="#b7c5ad">Measure return use after the novelty fades.</text></g><path d="M65 924H1435" stroke="#354231"/><text x="65" y="961" font-size="12" fill="#82967a">Illustrative engineering concept — not production CAD, wiring instructions, or measured specifications.</text><text x="65" y="986" font-size="12" fill="#82967a">Proposed envelope and layout require acoustic, RF, thermal, battery, and manufacturing validation.</text><text x="1435" y="986" text-anchor="end" font-size="12" fill="#d5ff83">MORI / 2026</text></g></svg>
